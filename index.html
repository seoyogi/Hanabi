<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>夜景花火3Dマップ</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <canvas id="renderCanvas" touch-action="none" style="width:100%; height:100vh;"></canvas>
  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = async () => {
      const scene = new BABYLON.Scene(engine);

      // 夜空スカイボックス
      const skybox = BABYLON.MeshBuilder.CreateBox("skyBox", {size:500}, scene);
      const skyMat = new BABYLON.StandardMaterial("skyMat", scene);
      skyMat.backFaceCulling = false;
      skyMat.disableLighting = true;
      skyMat.emissiveColor = new BABYLON.Color3(0,0,0);
      skybox.material = skyMat;

      // 星パーティクル
      const stars = new BABYLON.ParticleSystem("stars", 1000, scene);
      stars.particleTexture = new BABYLON.Texture("https://www.babylonjs.com/assets/Flare.png", scene);
      stars.minEmitBox = new BABYLON.Vector3(-250,50,-250);
      stars.maxEmitBox = new BABYLON.Vector3(250,250,250);
      stars.color1 = stars.color2 = new BABYLON.Color4(1,1,1,1);
      stars.minSize = 0.1; stars.maxSize = 0.3;
      stars.minLifeTime = stars.maxLifeTime = Number.MAX_SAFE_INTEGER;
      stars.emitRate = 1000;
      stars.start();

      // カメラ
      const camera = new BABYLON.ArcRotateCamera("Camera", Math.PI/2, Math.PI/4, 60, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);

      // 簡易道路
      const road = BABYLON.MeshBuilder.CreateGround("road", {width:80, height:6}, scene);
      const roadMat = new BABYLON.StandardMaterial("roadMat", scene);
      roadMat.diffuseColor = new BABYLON.Color3(0.1,0.1,0.1);
      road.material = roadMat;

      // ビル群
      for(let i=0;i<40;i++){
        const box = BABYLON.MeshBuilder.CreateBox(`box${i}`, {height: Math.random()*10+5, width:2, depth:2}, scene);
        box.position.x = Math.random()*70-35;
        box.position.z = Math.random()*50-25;
        box.position.y = box.scaling.y/2;
        const mat = new BABYLON.StandardMaterial(`mat${i}`, scene);
        mat.emissiveColor = new BABYLON.Color3(Math.random(),Math.random(),Math.random()).scale(0.5);
        box.material = mat;
      }

      // 花火音
      const fireworkSound = new BABYLON.Sound("firework", "https://www.soundjay.com/misc/sounds/firework-01.mp3", scene);

      // 花火作成関数
      const createFirework = (pos) => {
        fireworkSound.play();

        const ps = new BABYLON.ParticleSystem("firework", 500, scene);
        ps.particleTexture = new BABYLON.Texture("https://www.babylonjs.com/assets/Flare.png", scene);
        ps.emitter = pos;
        ps.minEmitBox = ps.maxEmitBox = new BABYLON.Vector3(0,0,0);
        ps.color1 = new BABYLON.Color4(Math.random(),Math.random(),Math.random(),1);
        ps.color2 = new BABYLON.Color4(Math.random(),Math.random(),Math.random(),1);
        ps.minSize = 0.2; ps.maxSize = 0.5;
        ps.minLifeTime = 0.5; ps.maxLifeTime = 1.5;
        ps.emitRate = 500;
        ps.direction1 = new BABYLON.Vector3(-1,1,-1);
        ps.direction2 = new BABYLON.Vector3(1,1,1);
        ps.gravity = new BABYLON.Vector3(0,-9.81,0);
        ps.manualEmitCount = 200;
        ps.start();

        setTimeout(() => { ps.dispose(); }, 1500);
      }

      // ランダム花火
      setInterval(() => {
        const x = Math.random()*60-30;
        const z = Math.random()*30-15;
        const y = 10 + Math.random()*10;
        createFirework(new BABYLON.Vector3(x,y,z));
      }, 800);

      // AR/VR対応
      await scene.createDefaultXRExperienceAsync({ optionalFeatures:true });

      return scene;
    }

    createScene().then(scene => {
      engine.runRenderLoop(() => scene.render());
    });

    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
