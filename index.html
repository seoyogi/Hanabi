<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>VR迷路</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/cannon.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <canvas id="renderCanvas"></canvas>
  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = () => {
      const scene = new BABYLON.Scene(engine);
      scene.enablePhysics(new BABYLON.Vector3(0, -9.81, 0), new BABYLON.CannonJSPlugin());

      // カメラ（VR用）
      const camera = new BABYLON.WebXRCamera("xrCamera", scene);
      camera.position = new BABYLON.Vector3(0, 1.6, 0);

      // 光源
      const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

      // 地面
      const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 20, height: 20}, scene);
      ground.physicsImpostor = new BABYLON.PhysicsImpostor(ground, BABYLON.PhysicsImpostor.BoxImpostor, {mass:0, restitution:0.1}, scene);

      // 壁（迷路サンプル）
      const wall1 = BABYLON.MeshBuilder.CreateBox("wall1", {width: 0.5, height:2, depth:5}, scene);
      wall1.position = new BABYLON.Vector3(2,1,0);
      wall1.physicsImpostor = new BABYLON.PhysicsImpostor(wall1, BABYLON.PhysicsImpostor.BoxImpostor, {mass:0, restitution:0.1}, scene);

      // コントローラー用
      let gamepad;
      window.addEventListener("gamepadconnected", (e) => { gamepad = e.gamepad; console.log("Gamepad connected", gamepad); });

      scene.onBeforeRenderObservable.add(() => {
        if(gamepad){
          const gp = navigator.getGamepads()[gamepad.index];
          if(gp){
            // 左スティックで前後左右
            const moveSpeed = 0.1;
            const forward = new BABYLON.Vector3(0,0,1);
            const right = new BABYLON.Vector3(1,0,0);
            const direction = forward.scale(gp.axes[1]).add(right.scale(gp.axes[0]));
            camera.position.addInPlace(direction.scale(moveSpeed));
          }
        }
      });

      // VRボタン
      const xr = scene.createDefaultXRExperienceAsync({floorMeshes:[ground]});

      return scene;
    }

    const scene = createScene();

    engine.runRenderLoop(() => { scene.render(); });
    window.addEventListener("resize", () => { engine.resize(); });
  </script>
</body>
</html>
